description: |
  Sensor driver for the pixart PMW3610 mouse sensor

compatible: "pixart,pmw3610-alt"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
  cpi:
    type: int
    default: 600
    description: "CPI value for normal (MOVE) mode (Range: 200 - 3200, Step: 200)"
  snipe-cpi:
    type: int
    default: 0
    description: |
      CPI value used when a snipe-layer is active (Range: 200 - 3200, Step: 200).
      Set to 0 to disable snipe mode CPI switching.
  swap-xy:
    type: boolean
    description: "Swap X/Y axes at sensor hardware level (applied before rotation transform)"
  invert-x:
    type: boolean
    description: "Invert X axis at sensor hardware level (applied before rotation transform)"
  invert-y:
    type: boolean
    description: "Invert Y axis at sensor hardware level (applied before rotation transform)"
  evt-type:
    type: int
    required: true
    description: "Input event type (e.g. INPUT_EV_REL)"
  x-input-code:
    type: int
    required: true
    description: "Input code for X axis (e.g. INPUT_REL_X)"
  y-input-code:
    type: int
    required: true
    description: "Input code for Y axis (e.g. INPUT_REL_Y)"
  force-awake:
    type: boolean
    description: "Keep sensor in high-performance mode while active"
  force-awake-4ms-mode:
    type: boolean
    description: "Use 4ms run rate when force-awake is enabled"
  scroll-layers:
    type: array
    default: []
    description: |
      List of keymap layer indices that activate SCROLL mode.
      When one of these layers is active, the orientation layer is not updated,
      so scrolling direction stays consistent with the last MOVE orientation.
      Actual scroll conversion is handled by the ZMK input-listener (zip_xy_to_scroll_mapper).
  snipe-layers:
    type: array
    default: []
    description: |
      List of keymap layer indices that activate SNIPE mode.
      When one of these layers is active, snipe-cpi is used instead of cpi,
      and the orientation layer is not updated.
  default-orientation-layer:
    type: int
    default: 0
    description: |
      Keymap layer index to use as the initial orientation at boot.
      Layer 0 = 0°, Layer 1 = 45°, Layer 2 = 90°, ..., Layer 7 = 315°.
      If > 0, that layer is activated in the keymap at initialization.
